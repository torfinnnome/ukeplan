[project]
name = "ukeplan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Torfinn Nome", email = "torfinn.nome@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "icalendar>=5.0.0",
    "jinja2>=3.1.4",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ukeplan = "ukeplan:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
